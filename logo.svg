  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round">
    <line x1="32" y1="16" x2="17" y2="32"/>
    <line x1="32" y1="16" x2="47" y2="32"/>
    <line x1="17" y1="32" x2="32" y2="48"/>
    <line x1="47" y1="32" x2="32" y2="48"/>
  </g>
  <g fill="#ffffff">
    <circle cx="32" cy="16" r="6"/>
    <circle cx="17" cy="32" r="5"/>
    <circle cx="47" cy="32" r="5"/>
    <circle cx="32" cy="48" r="6"/>
  </g>
</svg>
