name: Nightly Stock Scores Refresh

on:
  schedule:
    # UTC 18:00 = 北京 02:00（数据中心负载低，yfinance 限速概率小）
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      force_rerun:
        description: '强制全量重跑（忽略 24h 缓存）'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scoring/requirements.txt

      - name: Install deps
        run: pip install -r scoring/requirements.txt

      - name: Extract tickers from graph.html
        working-directory: scoring
        run: python extract_tickers.py

      - name: Batch score
        working-directory: scoring
        env:
          PYTHONIOENCODING: utf-8
          FORCE_RERUN: ${{ github.event.inputs.force_rerun }}
        run: |
          if [ "$FORCE_RERUN" = "true" ]; then
            python batch_score.py --force --sleep 1.5
          else
            python batch_score.py --sleep 1.5
          fi

      - name: Summarize results
        working-directory: scoring
        run: |
          python -c "
          import json
          d = json.load(open('../scores.json', encoding='utf-8'))
          ok = sum(1 for v in d.values() if v.get('status')=='ok')
          from collections import Counter
          dist = Counter(v.get('grade') for v in d.values() if v.get('status')=='ok')
          print(f'Total: {len(d)}, OK: {ok}, Distribution: {dict(dist)}')
          "

      - name: Build home stats (预聚合首页统计，~1KB)
        working-directory: scoring
        run: python build_home_stats.py

      - name: KOL performance leaderboard (KOL 战绩榜)
        working-directory: scoring
        env:
          PYTHONIOENCODING: utf-8
        run: python kol_perf.py

      - name: Commit and push if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add scores.json scoring/chain_tickers.json home_stats.json kol_perf.json community_perf.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            # 注意：故意不加 [skip ci]——让 Vercel 检测到 push 并自动部署，
            # 使每日刷新的 scores.json 进入生产（SEO 正文依赖最新评分）。
            # 本工作流仅由 schedule/workflow_dispatch 触发（无 push 触发），不会自循环。
            git commit -m "data: nightly scores refresh $(date -u +%Y-%m-%d)"
            # 防止与其他 push 冲突
            git pull --rebase origin main
            git push
          fi
