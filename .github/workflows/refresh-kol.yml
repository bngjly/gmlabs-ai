name: Refresh KOL Opinions Cache

on:
  schedule:
    # 每小时刷新一次
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch MasterTicker KOL opinions
        run: |
          curl -sf --retry 3 --retry-delay 10 \
            -H 'User-Agent: ChainGraph/1.0 (gmlabs.ai)' \
            -H 'Accept: application/json' \
            'https://masterticker.com/api/twitter/opinions/latest?limit=60' \
            -o kol_cache_new.json

          # 验证 JSON 有效且有 items
          python3 -c "
          import json, sys
          d = json.load(open('kol_cache_new.json'))
          items = d.get('items', [])
          if len(items) == 0:
              print('WARNING: 0 items returned, keeping old cache')
              sys.exit(1)
          print(f'OK: {len(items)} items, generated={d.get(\"generated_at\",\"?\")}')
          "

          mv kol_cache_new.json kol_cache.json

      - name: Commit and push if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add kol_cache.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: refresh KOL cache $(date -u +%Y-%m-%d\ %H:%M) [skip ci]"
            git push
          fi
