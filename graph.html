<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 内嵌框架页：独立访问不收录，规范落地页为首页深链 /?t=TICKER（分享深链由 middleware 注入 canonical 归并权重） -->
<meta name="robots" content="noindex,follow">
<title>AI 产业链全景图谱 · 可扩展版</title>
<style>
* { box-sizing: border-box; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; margin: 0; background: #0f1419; color: #e6e6e6; line-height: 1.5; }
header { padding: 14px 24px; background: linear-gradient(180deg,#1a2230,#151c28); border-bottom: 1px solid #2a3548; position: sticky; top: 0; z-index: 50; }
.head-row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
header h1 { margin: 0; font-size: 20px; color: #4fc3f7; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; flex: 1; }
.controls input, .controls button { background: #222e3e; color: #e6e6e6; border: 1px solid #3a4860; padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; outline: none; }
.controls button:hover { background: #2d3b50; border-color: #4fc3f7; }
.controls input { width: 220px; cursor: text; }

/* 搜索框 + 清空按钮 */
.search-wrap { position: relative; display: inline-block; }
.search-wrap input { padding-right: 30px; }
.search-clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #6b7785; font-size: 16px; padding: 2px 6px; border-radius: 50%; line-height: 1; user-select: none; display: none; }
.search-clear:hover { color: #fff; background: #2a3548; }
.search-wrap.has-value .search-clear { display: inline; }
.legend { font-size: 12px; color: #9aa5b1; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin-left: auto; }
.legend > span { cursor: pointer; transition: .15s; padding: 2px 6px; border-radius: 12px; user-select: none; }
.legend > span:hover { background: #2a3548; color: #e6e6e6; }
.legend > span.filter-on { background: rgba(79,195,247,.15); box-shadow: inset 0 0 0 1px #4fc3f7; color: #fff; }
.legend > span.no-click { cursor: default; }
.legend > span.no-click:hover { background: transparent; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
.t-core { background: #d32f2f; color: #fff; }
.t-watch { background: #f59e0b; color: #000; }
.t-comp { background: #455a75; color: #cde; }
.t-cn { background: #166534; color: #fff; }
main { padding: 20px; max-width: 1500px; margin: 0 auto; }
.node { margin: 8px 0; }
.node-header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #1c2632; border: 1px solid #2a3548; border-radius: 8px; cursor: pointer; transition: .15s; user-select: none; }
.node-header:hover { background: #243245; border-color: #4fc3f7; }
.deep-link-highlight .node-header { outline: 2px solid #4fc3f7; box-shadow: 0 0 16px rgba(79,195,247,.5); transition: outline .3s, box-shadow .3s; }
.layer-1 { border-left: 5px solid #ef4444; }
.layer-2 { border-left: 5px solid #f59e0b; }
.layer-3 { border-left: 5px solid #eab308; }
.layer-4 { border-left: 5px solid #22c55e; }
.layer-5 { border-left: 5px solid #06b6d4; }
.layer-6 { border-left: 5px solid #3b82f6; }
.layer-7 { border-left: 5px solid #8b5cf6; }
.layer-8 { border-left: 5px solid #ec4899; }
.layer-9 { border-left: 5px solid #94a3b8; }
.layer-10 { border-left: 5px solid #14b8a6; }
.layer-98 { border-left: 5px solid #fbbf24; background: linear-gradient(90deg, rgba(251,191,36,.06) 0%, transparent 50%); }
.layer-99 { border-left: 5px solid #64748b; }
.toggle { width: 16px; text-align: center; color: #4fc3f7; font-weight: bold; font-size: 12px; }
.node-title { font-weight: 600; font-size: 15px; }
.node-desc { color: #9aa5b1; font-size: 12px; margin-left: auto; font-weight: 400; }
.node-body { padding: 12px 14px 14px 34px; border-left: 2px dashed #2a3548; margin-left: 18px; }
.sub-section-title { font-size: 12px; color: #9aa5b1; margin: 10px 0 6px; text-transform: uppercase; letter-spacing: 1px; }
.companies { display: flex; flex-wrap: wrap; gap: 8px; }
.company { position: relative; background: #222e3e; border: 1px solid #3a4860; padding: 6px 10px; padding-right: 66px; border-radius: 6px; font-size: 13px; min-width: 130px; transition: .15s; }
.company:hover { background: #2d3b50; border-color: #4fc3f7; }
.company.core { border-color: #ef4444; background: #3a1f24; }
.company.watch { border-color: #f59e0b; background: #3a2f1a; }
.company .ticker { font-weight: 700; color: #4fc3f7; font-size: 13px; }
.company .cn-name { color: #ddd; font-size: 12px; margin-left: 4px; }
.company .role { color: #9aa5b1; font-size: 11px; display: block; margin-top: 2px; }
.company .watch-btn { position: absolute; top: 4px; right: 4px; font-size: 10px; padding: 2px 8px; border-radius: 10px; cursor: pointer; color: #9aa5b1; background: #1c2632; border: 1px solid #2a3548; transition: .12s; user-select: none; line-height: 1.5; white-space: nowrap; }
.company .watch-btn:hover { color: #f59e0b; border-color: #f59e0b; }
.company .watch-btn.on { color: #fbbf24; background: #3a2f1a; border-color: #f59e0b; font-weight: 600; }
.company .watch-btn.on:hover { color: #fff; background: #3a1f24; border-color: #ef4444; }
.actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.btn-sm { background: #1c2632; color: #4fc3f7; border: 1px dashed #4fc3f7; padding: 4px 10px; border-radius: 5px; font-size: 12px; cursor: pointer; }
.btn-sm:hover { background: #243245; }
.btn-del { color: #ef4444; border-color: #ef4444; }
.collapsed > .node-body { display: none; }
.collapsed > .node-header .toggle::before { content: '▶'; }
.expanded > .node-header .toggle::before { content: '▼'; }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: none; align-items: center; justify-content: center; z-index: 100; }
.modal-bg.show { display: flex; }
.modal { background: #1c2632; padding: 24px; border-radius: 10px; min-width: 380px; max-width: 520px; border: 1px solid #3a4860; }
.modal h3 { margin: 0 0 16px; color: #4fc3f7; }
.modal input, .modal textarea, .modal select { width: 100%; background: #0f1419; color: #e6e6e6; border: 1px solid #3a4860; padding: 8px 10px; border-radius: 6px; margin-bottom: 10px; font-size: 13px; font-family: inherit; }
.modal label { font-size: 12px; color: #9aa5b1; display: block; margin: 6px 0 4px; }
.modal-row { display: flex; gap: 10px; }
.modal-row > div { flex: 1; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
.modal button { background: #4fc3f7; color: #000; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
.modal button.secondary { background: #455a75; color: #fff; }
.hint { font-size: 11px; color: #6b7785; margin-top: 8px; padding: 8px; background: #0f1419; border-radius: 4px; border-left: 2px solid #4fc3f7; }
.hidden { display: none !important; }
.stat-bar { font-size: 11px; color: #9aa5b1; padding: 6px 0; }

/* ===== 评分徽章 ===== */
.grade-badge { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 10px; font-weight: 700; margin-left: 6px; vertical-align: middle; letter-spacing: 0.3px; cursor: help; }
.grade-S { background: linear-gradient(135deg, #ef4444, #f59e0b); color: #fff; }
.grade-A { background: #22c55e; color: #000; }
.grade-B { background: #3b82f6; color: #fff; }
.grade-C { background: #f59e0b; color: #000; }
.grade-D { background: #6b7785; color: #fff; }
.grade-NA { background: #2a3548; color: #6b7785; }

/* 数据置信度提示 */
.data-confidence { margin-top: 12px; padding: 8px 12px; font-size: 11px; line-height: 1.6;
  color: #d4a73f; background: rgba(251,191,36,.07); border: 1px solid rgba(251,191,36,.25); border-radius: 6px; }

/* 图谱分区分隔条 */
.section-divider { margin: 26px 0 14px; padding: 8px 16px; font-size: 13px; font-weight: 800;
  letter-spacing: 1px; color: #4fc3f7; background: linear-gradient(90deg, rgba(79,195,247,.12), transparent 70%);
  border-left: 3px solid #4fc3f7; border-radius: 4px; }

/* AI 暴露度徽章 */
.ai-badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: 700; margin-left: 4px; vertical-align: middle; cursor: help; }
.ai-high { background: rgba(168,85,247,.2); color: #c084fc; border: 1px solid rgba(168,85,247,.45); }
.ai-mid { background: rgba(79,195,247,.15); color: #4fc3f7; border: 1px solid rgba(79,195,247,.35); }
.ai-low { background: rgba(107,119,133,.18); color: #8a96a3; border: 1px solid rgba(107,119,133,.4); }

.score-tags { display: flex; gap: 3px; margin-top: 4px; flex-wrap: wrap; max-width: 240px; }
.tag-feat { background: #1a3a2a; border: 1px solid #22552f; padding: 1px 5px; border-radius: 3px; font-size: 10px; color: #86efac; }
.tag-risk { background: #3a1a1f; border: 1px solid #5a2228; padding: 1px 5px; border-radius: 3px; font-size: 10px; color: #fca5a5; }
.serenity-badge { display: inline-block; background: #2a1f0f; border: 1px solid #5a4220; padding: 1px 6px; border-radius: 8px; font-size: 10px; margin-left: 4px; vertical-align: middle; cursor: help; }
.serenity-badge:hover { background: #3a2f1a; }

/* ===== 详情抽屉 ===== */
.drawer-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: stretch; justify-content: flex-end; z-index: 200; }
.drawer-bg.show { display: flex; }
.drawer { background: #1a2230; width: 100%; max-width: 480px; height: 100vh; overflow-y: auto; padding: 24px; border-left: 1px solid #2a3548; animation: slideIn .25s ease-out; }
@keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
.drawer-head { display: flex; align-items: flex-start; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid #2a3548; margin-bottom: 18px; }
.drawer-head .ticker-big { font-size: 22px; font-weight: 700; color: #4fc3f7; }
.drawer-head .name-cn { font-size: 13px; color: #9aa5b1; margin-top: 2px; }
.drawer-head .close-x { margin-left: auto; cursor: pointer; color: #9aa5b1; font-size: 24px; line-height: 1; padding: 4px 8px; user-select: none; }
.drawer-head .close-x:hover { color: #fff; }
.drawer-score { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
.drawer-score .grade-big { font-size: 30px; font-weight: 800; padding: 4px 14px; border-radius: 8px; line-height: 1.1; }
.drawer-score .total-num { font-size: 28px; font-weight: 700; }
.drawer-score .total-of { font-size: 13px; color: #9aa5b1; }
.drawer-tier-sector { font-size: 12px; color: #9aa5b1; margin-bottom: 18px; }
.drawer-tier-sector .pill { background: #243245; padding: 2px 8px; border-radius: 10px; margin-right: 6px; }
.drawer-section { margin-bottom: 22px; }
.drawer-section h4 { font-size: 12px; color: #9aa5b1; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; font-weight: 500; }
.dim-bars { display: flex; flex-direction: column; gap: 8px; }
.dim-bar { display: flex; align-items: center; gap: 10px; font-size: 12px; }
.dim-bar .lbl { width: 90px; color: #cfd5dc; }
.dim-bar .track { flex: 1; display: block; height: 8px; background: #0f1419; border-radius: 4px; overflow: hidden; position: relative; }
.dim-bar .fill { display: block; height: 100%; background: linear-gradient(90deg, #3b82f6, #4fc3f7); border-radius: 4px; transition: width .4s; }
.dim-bar .pct { width: 60px; text-align: right; color: #9aa5b1; font-size: 11px; }
.drawer-tags { display: flex; flex-direction: column; gap: 6px; }
.drawer-tag-row { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 6px 10px; border-radius: 6px; }
.drawer-tag-row.feat { background: #1a3a2a; color: #86efac; border-left: 3px solid #22c55e; }
.drawer-tag-row.risk { background: #3a1a1f; color: #fca5a5; border-left: 3px solid #ef4444; }
.drawer-tag-row .emj { font-size: 16px; }
.drawer-actions { display: flex; gap: 8px; margin-top: 24px; padding-top: 16px; border-top: 1px solid #2a3548; }
.drawer-actions button { flex: 1; padding: 9px; }
.no-score { background: #0f1419; padding: 14px; border-radius: 8px; border: 1px dashed #3a4860; color: #9aa5b1; font-size: 12px; text-align: center; }
.score-meta { font-size: 11px; color: #6b7785; margin-top: 16px; text-align: right; }

/* ===== AI 深度分析（drawer 内） ===== */
.ai-section { margin-top: 20px; padding-top: 18px; border-top: 1px solid #2a3548; }
.ai-section h4 { font-size: 13px; color: #4fc3f7; margin-bottom: 12px; font-weight: 600; }
.ai-btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.ai-btn-sm { background: #1c2632; border: 1px solid #3a4860; padding: 8px 10px; border-radius: 6px; font-size: 12px; color: #cfd5dc; cursor: pointer; transition: .15s; text-align: left; line-height: 1.3; }
.ai-btn-sm:hover { border-color: #4fc3f7; background: #243245; color: #fff; }
.ai-btn-sm:disabled { opacity: 0.4; cursor: not-allowed; }
.ai-btn-sm .ico { font-size: 14px; margin-right: 4px; }
.ai-result-panel { margin-top: 16px; background: #0f1419; border: 1px solid #2a3548; border-radius: 8px; padding: 14px 16px; font-size: 13px; line-height: 1.7; color: #cfd5dc; }
.ai-result-panel h1, .ai-result-panel h2, .ai-result-panel h3 { color: #4fc3f7; margin: 12px 0 8px; font-weight: 600; }
.ai-result-panel h1 { font-size: 16px; }
.ai-result-panel h2 { font-size: 15px; }
.ai-result-panel h3 { font-size: 13px; }
.ai-result-panel p { margin: 8px 0; }
.ai-result-panel strong { color: #fff; }
.ai-result-panel em { color: #9aa5b1; font-style: italic; }
.ai-result-panel ul, .ai-result-panel ol { margin: 8px 0 8px 20px; }
.ai-result-panel li { margin: 4px 0; }
.ai-result-panel blockquote { border-left: 3px solid #4fc3f7; padding-left: 12px; margin: 12px 0; color: #9aa5b1; font-size: 11px; }
.ai-result-panel code { background: #2a3548; padding: 1px 6px; border-radius: 3px; font-size: 12px; }
.ai-result-panel table { border-collapse: collapse; margin: 8px 0; }
.ai-result-panel th, .ai-result-panel td { border: 1px solid #2a3548; padding: 4px 10px; font-size: 12px; }
.ai-result-panel th { background: #1c2632; color: #4fc3f7; }
.ai-loading { display: flex; align-items: center; gap: 10px; color: #9aa5b1; font-size: 13px; padding: 16px; }
.ai-spinner { width: 14px; height: 14px; border: 2px solid #4fc3f7; border-bottom-color: transparent; border-radius: 50%; animation: ai-spin 0.7s linear infinite; }
@keyframes ai-spin { to { transform: rotate(360deg); } }
.ai-meta { font-size: 10px; color: #6b7785; text-align: right; margin-top: 10px; }

/* ===== 层级快速导航 chips ===== */
.layer-chips { padding: 8px 24px; background: #0f1419; border-bottom: 1px solid #1c2632; box-shadow: 0 2px 8px rgba(0,0,0,.4); position: sticky; top: var(--header-height, 60px); z-index: 40; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; min-height: 36px; }
.chip { padding: 4px 10px; background: #1c2632; border: 1px solid #2a3548; border-radius: 14px; font-size: 12px; cursor: pointer; transition: .15s; white-space: nowrap; color: #cfd5dc; user-select: none; }
.chip:hover { border-color: #4fc3f7; color: #fff; background: #243245; }
.chip.active { background: #243245; border-color: #4fc3f7; color: #4fc3f7; font-weight: 600; }
.chip-all { color: #9aa5b1; }
.chip-action { color: #fbbf24; border-color: #3a3220; }
.chip-action:hover { border-color: #fbbf24; color: #fff; }
.chip-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }

/* ===== 更多菜单 ===== */
.more-menu-wrap { position: relative; }
.more-menu-wrap > button { padding: 6px 10px; font-weight: 700; }
.more-menu { position: absolute; top: calc(100% + 6px); right: 0; background: #1a2230; border: 1px solid #2a3548; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.5); padding: 6px; min-width: 240px; display: none; z-index: 60; }
.more-menu.show { display: block; }
.more-menu button { display: block; width: 100%; text-align: left; background: transparent; border: none; padding: 8px 10px; border-radius: 5px; color: #cfd5dc; font-size: 13px; cursor: pointer; }
.more-menu button:hover { background: #243245; color: #fff; }
.more-menu-sep { height: 1px; background: #2a3548; margin: 4px 0; }

/* ===== 编辑提示横幅 ===== */
.edit-hint { background: #1a2230; border: 1px dashed #fbbf24; padding: 6px 12px; border-radius: 6px; font-size: 11px; color: #fbbf24; margin: 10px 0 8px; display: flex; align-items: center; gap: 8px; }
.edit-hint .label { font-weight: 600; }
</style>
</head>
<body>
<header>
  <div class="head-row">
    <h1>🧠 AI 产业链全景图谱</h1>
    <div class="controls">
      <span class="search-wrap" id="searchWrap">
        <input id="search" placeholder="🔍 实时过滤·输入即筛选（Esc 清空）" oninput="onSearchInput()" onkeydown="if(event.key==='Escape')clearSearch()" />
        <span class="search-clear" onclick="clearSearch()" title="清空搜索 (Esc)">×</span>
      </span>
      <div class="more-menu-wrap">
        <button onclick="toggleMoreMenu(event)" title="更多操作">⋯</button>
        <div class="more-menu" id="moreMenu">
          <button onclick="exportData(); closeMoreMenu()">📥 导出 JSON（备份你的编辑）</button>
          <button onclick="document.getElementById('importFile').click(); closeMoreMenu()">📤 导入 JSON</button>
          <input id="importFile" type="file" accept=".json" style="display:none" onchange="importData(event)" />
          <div class="more-menu-sep"></div>
          <button onclick="resetData(); closeMoreMenu()" style="color:#ef4444">🗑️ 重置为最新默认</button>
        </div>
      </div>
    </div>
    <div class="legend">
      <span onclick="toggleFlagFilter('core')" id="filter-core" title="点击筛选只看核心"><span class="tag t-core">核心</span> 卡脖子龙头</span>
      <span onclick="toggleFlagFilter('watch')" id="filter-watch" title="点击筛选只看自选"><span class="tag t-watch">自选</span> 你已关注</span>
      <span onclick="toggleFlagFilter('comp')" id="filter-comp" title="点击筛选只看相关"><span class="tag t-comp">相关</span> 主供/竞争者</span>
      <span onclick="toggleFlagFilter('cn')" id="filter-cn" title="点击筛选只看中国"><span class="tag t-cn">中国</span> A 股 / 港股</span>
      <span class="stat-bar no-click" id="stat"></span>
    </div>
  </div>
</header>
<div class="layer-chips" id="chipBar"></div>
<div id="noResultsBanner" style="display:none; margin: 24px auto; max-width: 720px; padding: 24px; background: #1a2230; border: 1px dashed #4fc3f7; border-radius: 12px; text-align: center;">
  <div style="font-size: 16px; margin-bottom: 8px;">🤷 没找到 "<span id="noResultsQuery" style="color:#4fc3f7;font-weight:600"></span>"</div>
  <div style="color: #9aa5b1; font-size: 13px; margin-bottom: 16px;">可能是图谱还没收录这家公司或赛道</div>
  <button class="btn-sm" onclick="openContribute()" style="font-size: 13px; padding: 8px 16px;">+ 申请收录这家公司</button>
</div>
<main id="tree"></main>

<div class="drawer-bg" id="drawer" onclick="if(event.target===this)closeDrawer()">
  <div class="drawer" id="drawerInner"></div>
</div>

<div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalInner"></div>
</div>

<script>
// ============= 默认数据：AI 产业链 10 层 =============
const DEFAULT_DATA = {
  id: 'root', name: 'AI 产业链全景', layer: 0, expanded: true, children: [
    {
      id: 'L1', name: '① 算力芯片 GPU / XPU', layer: 1, expanded: true,
      desc: '大脑：执行矩阵乘法 / 张量运算',
      companies: [
        { t: 'NVDA', cn: '英伟达', role: 'GPU 绝对霸主 Blackwell/Rubin', flag: 'core' },
        { t: 'AMD', cn: 'AMD', role: 'MI300/MI400 唯一挑战者', flag: 'comp' },
        { t: 'CBRS', cn: 'Cerebras Systems', role: '晶圆级 AI 芯片（WSE 85 万核），叙事强但市场份额 <1%，2026 IPO 验证期', flag: 'comp' },
        { t: 'AVGO', cn: '博通', role: 'Google TPU / Meta MTIA 代工', flag: 'core' },
        { t: 'MRVL', cn: '迈威尔', role: 'AWS Trainium 合作 / 定制 ASIC', flag: 'watch' },
        { t: 'INTC', cn: '英特尔', role: 'Gaudi 边缘玩家', flag: 'comp' },
      ],

// 改 DEFAULT_DATA 后递增版本号，自动失效用户旧 localStorage
const DATA_VERSION = '2026-06-04-v10';  // +ROG/PENG/NXPI/BE/SMIC/ASMPT 等 9 个文章漏点补全

let data = loadData();
let editTarget = null;
let SCORES = {};   // ← 由 fetch scores.json 加载，公司评分数据

function loadData() {
  try {
    const storedVersion = localStorage.getItem('aiChain_version');
    const stored = localStorage.getItem('aiChain_v1');
    if (stored && storedVersion === DATA_VERSION) return JSON.parse(stored);
    // 版本升级：保留用户已有 watch 自选，迁移到新 DEFAULT_DATA
    if (stored) {
      console.log(`[ChainGraph] 数据版本升级 ${storedVersion} → ${DATA_VERSION}，迁移自选`);
      const userData = JSON.parse(stored);
      const userWatches = collectWatches(userData);
      const fresh = structuredClone(DEFAULT_DATA);
      applyWatches(fresh, userWatches);
      return fresh;
    }
  } catch(e) {}
  // 真·新用户：剥离 DEFAULT_DATA 中的 watch（不污染 onboarding）
  const fresh = structuredClone(DEFAULT_DATA);
  stripWatches(fresh);
  return fresh;
}
function collectWatches(node, set = new Set()) {
  (node.companies || []).forEach(c => { if ((c.flag || '').split(/\s+/).includes('watch')) set.add(c.t); });
  (node.children || []).forEach(c => collectWatches(c, set));
  return set;
}
function applyWatches(node, watchSet) {
  (node.companies || []).forEach(c => {
    const fl = (c.flag || '').split(/\s+/).filter(f => f && f !== 'watch');
    if (watchSet.has(c.t)) fl.push('watch');
    c.flag = fl.join(' ').trim();
  });
  (node.children || []).forEach(c => applyWatches(c, watchSet));
}
function stripWatches(node) {
  (node.companies || []).forEach(c => {
    if (c.flag) c.flag = c.flag.split(/\s+/).filter(f => f !== 'watch').join(' ').trim();
  });
  (node.children || []).forEach(stripWatches);
}
function save() {
  localStorage.setItem('aiChain_v1', JSON.stringify(data));
  localStorage.setItem('aiChain_version', DATA_VERSION);
  updateStat();
}

// ============ 深链直达（?t=TICKER 自动定位并展开评分抽屉）============
// 用于视频/社媒分享：gmlabs.ai/graph.html?t=NVDA 进站即展开该公司评分
const DEEP_LINK_TICKER = new URLSearchParams(location.search).get('t');
let deepLinkApplied = false;

function findCompanyPath(ticker, node = data, path = '') {
  const target = ticker.toUpperCase();
  for (let i = 0; i < (node.companies || []).length; i++) {
    if ((node.companies[i].t || '').toUpperCase() === target) return { path, idx: i };
  }
  for (let i = 0; i < (node.children || []).length; i++) {
    const childPath = path ? `${path}.children.${i}` : `children.${i}`;
    const found = findCompanyPath(ticker, node.children[i], childPath);
    if (found) return found;
  }
  return null;
}

function applyDeepLink() {
  if (deepLinkApplied || !DEEP_LINK_TICKER) return;
  const found = findCompanyPath(DEEP_LINK_TICKER);
  if (!found) return;
  deepLinkApplied = true;

  // 展开路径上所有祖先节点，让目标公司可见
  const parts = found.path.split('.');
  let acc = '';
  for (let i = 0; i < parts.length; i += 2) {
    acc = acc ? `${acc}.${parts[i]}.${parts[i+1]}` : `${parts[i]}.${parts[i+1]}`;
    const n = getNode(acc);
    if (n) n.expanded = true;
  }
  render();

  setTimeout(() => {
    const el = document.querySelector(`.node[data-path="${found.path}"]`);
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.classList.add('deep-link-highlight');
      setTimeout(() => el.classList.remove('deep-link-highlight'), 2000);
    }
    openDetail(found.path, found.idx);
  }, 150);
}

// ============ 层级快速导航 chip 渲染 ============
const LAYER_COLOR = {
  1:'#ef4444', 2:'#f59e0b', 3:'#eab308', 4:'#22c55e', 5:'#06b6d4',
  6:'#3b82f6', 7:'#8b5cf6', 8:'#ec4899', 9:'#94a3b8', 10:'#14b8a6',
  98:'#fbbf24', 99:'#64748b',
};
function renderChipBar() {
  const top = data.children || [];
  const chips = top.map((node, i) => {
    // 抓首个 emoji 或 ① ② ... 标记
    const m = node.name.match(/^(\S+)\s*(.+)$/);
    const icon = m ? m[1] : node.name.slice(0, 2);
    const label = m ? (m[2].length > 8 ? m[2].slice(0, 6) + '..' : m[2]) : '';
    const color = LAYER_COLOR[node.layer] || '#94a3b8';
    return `<span class="chip" onclick="jumpToLayer('children.${i}')" title="${escapeHtml(node.name)}">
      <span class="chip-dot" style="background:${color}"></span>${escapeHtml(icon)} ${escapeHtml(label)}
    </span>`;
  }).join('');
  document.getElementById('chipBar').innerHTML = `
    <span class="chip chip-all" onclick="expandAll()">⊕ 全展</span>
    <span class="chip chip-all" onclick="collapseAll()">⊖ 全折</span>
    <span style="color:#3a4860;flex-shrink:0">|</span>
    ${chips}
  `;
}

function jumpToLayer(path) {
  // 关闭所有顶层，只展开目标
  (data.children || []).forEach(n => n.expanded = false);
  const target = getNode(path);
  if (target) target.expanded = true;
  save();
  render();
  // 滚动到目标节点
  setTimeout(() => {
    const el = document.querySelector(`.node[data-path="${path}"]`);
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      el.querySelector('.node-header').style.outline = '2px solid #4fc3f7';
      setTimeout(() => { el.querySelector('.node-header').style.outline = ''; }, 1500);
    }
  }, 50);
}

function renderNode(node, path) {
  if (node.id === 'root') {
    // 分区：L1-L10 = 供应链纵深；L11/L12/L99 = 应用前线；LS = 特别关注
    const SECTION_BEFORE = {
      'L1':  '🏗️ 产业链纵深 · 供应链上下游',
      'L11': '🤖 应用前线 · AI 下游场景（机器人 / 卫星 / 国防）',
      'LS':  '🌟 特别关注',
      'L99': '🛸 旁支赛道',
    };
    return (node.children || []).map((c, i) => {
      const divider = SECTION_BEFORE[c.id]
        ? `<div class="section-divider">${SECTION_BEFORE[c.id]}</div>` : '';
      return divider + renderNode(c, `children.${i}`);
    }).join('');
  }
  const expanded = node.expanded !== false;
  const cls = `node ${expanded ? 'expanded' : 'collapsed'} layer-${node.layer || 99}`;
  const childHTML = (node.children || []).map((c, i) => renderNode(c, `${path}.children.${i}`)).join('');
  const companyHTML = renderCompanies(node.companies || [], path);
  return `
    <div class="${cls}" data-path="${path}">
      <div class="node-header" onclick="toggleNode('${path}', event)">
        <span class="toggle"></span>
        <span class="node-title">${escapeHtml(node.name)}</span>
        ${node.desc ? `<span class="node-desc">${escapeHtml(node.desc)}</span>` : ''}
      </div>
      <div class="node-body">
        ${(node.companies && node.companies.length) ? `<div class="sub-section-title">公司</div><div class="companies">${companyHTML}</div>` : ''}
        ${childHTML ? `<div class="sub-section-title" style="margin-top:14px">细分子赛道</div>${childHTML}` : ''}
        <div class="edit-hint" title="Phase 2 接入社区 PR 系统后，编辑会变成提交给所有人审核">
          <span>✏️</span>
          <span class="label">本地编辑模式</span>
          <span style="color:#cfd5dc">— 改动只存你的浏览器，不影响其他人</span>
        </div>
        <div class="actions">
          <button class="btn-sm" onclick="openAddCompany('${path}')">+ 添加公司</button>
          <button class="btn-sm" onclick="openAddChild('${path}')">+ 添加子赛道</button>
          <button class="btn-sm" onclick="openEditNode('${path}')">✎ 编辑此层</button>
          <button class="btn-sm btn-del" onclick="deleteNode('${path}')">✕ 删除此层</button>
        </div>
      </div>
    </div>`;
}

function renderCompanies(arr, path) {
  return arr.map((c, i) => {
    const flags = (c.flag || '').split(/\s+/);
    const isCore = flags.includes('core');
    const isWatch = flags.includes('watch');
    const isCn = flags.includes('cn');
    let cls = 'company';
    if (isCore) cls += ' core';
    if (isWatch) cls += ' watch';
    const tags = [];
    if (isCore) tags.push('<span class="tag t-core">核心</span>');
    if (isWatch) tags.push('<span class="tag t-watch">自选</span>');
    if (isCn) tags.push('<span class="tag t-cn">中国</span>');
    if (!isCore && !isWatch && !isCn) tags.push('<span class="tag t-comp">相关</span>');

    // 评分徽章 + 特点标签（来自 gm_rater）
    // 防御：cn 名含"未上市"则跳过评分查询（防 ticker 撞车，如 EVG）
    const isUnlisted = /未上市|待上市/.test(c.cn || '');
    const sc = isUnlisted ? null : SCORES[c.t];
    let gradeBadge = '';
    let featTags = '';
    // AI 暴露度徽章（与评分独立）
    const aiLevel = isUnlisted ? null : AI_EXPOSURE[c.t];
    const AI_LABEL = { high: 'AI高', mid: 'AI中', low: 'AI低' };
    const AI_TITLE = { high: 'AI 相关营收 ≥50%', mid: 'AI 相关营收 15-50%', low: 'AI 相关营收 <15%' };
    const aiBadge = aiLevel ? `<span class="ai-badge ai-${aiLevel}" title="${AI_TITLE[aiLevel]}">${AI_LABEL[aiLevel]}</span>` : '';
    if (sc && sc.status === 'ok') {
      gradeBadge = `<span class="grade-badge grade-${sc.grade}" title="${sc.tier}/${sc.sector} · 总分 ${sc.score}">${sc.grade} · ${sc.score}</span>`;
      if (sc.features && sc.features.length) {
        featTags = `<div class="score-tags">` +
          sc.features.slice(0,2).map(f => `<span class="tag-feat">${f.emoji}${f.name}</span>`).join('') +
          (sc.risks||[]).slice(0,1).map(r => `<span class="tag-risk">${r.emoji}${r.name}</span>`).join('') +
          `</div>`;
      }
    }


    const watchLabel = isWatch ? '★ 已选' : '☆ 自选';
    const watchTitle = isWatch ? '点击取消自选' : '点击加入自选';
    return `<div class="${cls}" data-flag="${escapeHtml(c.flag || '')}" onclick="openDetail('${path}', ${i})">
      <span class="watch-btn ${isWatch?'on':''}" onclick="toggleWatch('${path}', ${i}, event)" title="${watchTitle}">${watchLabel}</span>
      <div><span class="ticker">${escapeHtml(c.t)}</span><span class="cn-name">${escapeHtml(c.cn || '')}</span>${gradeBadge}${aiBadge}</div>
      <span class="role">${escapeHtml(c.role || '')} ${tags.join('')}</span>
      ${featTags}
    </div>`;
  }).join('');
}

function escapeHtml(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ============ 路径取节点 ============
function getNode(path) {
  if (!path) return data;
  return path.split('.').reduce((o, k) => o[k], data);
}
function setNode(path, value) {
  const parts = path.split('.');
  const last = parts.pop();
  const parent = parts.reduce((o, k) => o[k], data);
  parent[last] = value;
}

// ============ 交互 ============
function toggleNode(path, e) {
  e.stopPropagation();
  const n = getNode(path);
  n.expanded = n.expanded === false ? true : false;
  save(); render();
}
function expandAll() { walk(data, n => n.expanded = true); save(); render(); }
function collapseAll() { walk(data, n => { if (n.id !== 'root') n.expanded = false; }); save(); render(); }

function closeMoreMenu() {

document.addEventListener('click', e => {

function walk(n, fn) { fn(n); (n.children || []).forEach(c => walk(c, fn)); }

// ============ AI 深度分析（调 /api/analyze）============
async function runAnalysis(path, idx, feature) {
  const node = getNode(path);
  const c = node.companies[idx];
  const sc = SCORES[c.t] || null;

  const panel = document.getElementById('ai-result');
  if (!panel) return;
  panel.style.display = 'block';
  panel.innerHTML = `<div class="ai-loading"><span class="ai-spinner"></span> AI 正在分析 <strong>${escapeHtml(c.t)}</strong> · 通常 5-15 秒...</div>`;

  // 禁用所有按钮防重复点击
  document.querySelectorAll('.ai-btn-sm').forEach(b => b.disabled = true);

  try {
    const resp = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        ticker: c.t,
        feature: feature,
        company: {
          t: c.t,
          cn: c.cn,
          role: c.role,
          flag: c.flag,
          layer_name: node.name || '',
        },
        score: sc,
      }),
    });

    const data = await resp.json();

    if (!resp.ok || !data.ok) {
      panel.innerHTML = `<div style="color:#fca5a5">❌ <strong>分析失败</strong><br>${escapeHtml(data.error || resp.statusText)}</div>`;
      return;
    }

    // 渲染 markdown
    const html = window.marked ? window.marked.parse(data.content) : escapeHtml(data.content).replace(/\n/g, '<br>');
    const usage = data.usage ? `· tokens 输入 ${data.usage.promptTokenCount || '-'} / 输出 ${data.usage.candidatesTokenCount || '-'}` : '';
    // finishReason 不是 STOP 给警告
    let truncWarn = '';
    if (data.finishReason && data.finishReason !== 'STOP') {
      const msg = {
        'MAX_TOKENS': '⚠️ 输出已达 token 上限被截断',
        'SAFETY': '⚠️ 内容因安全策略部分截断',
        'RECITATION': '⚠️ 内容包含引用被截断',
        'OTHER': '⚠️ 输出未完整结束',
      }[data.finishReason] || `⚠️ 完成原因: ${data.finishReason}`;
      truncWarn = `<div style="background:#3a2f1a;color:#fbbf24;padding:8px 12px;border-radius:6px;margin-top:12px;font-size:12px">${msg}</div>`;
    }
    panel.innerHTML = html + truncWarn + `<div class="ai-meta">${data.feature_name} · ${data.model} · ${(data.elapsed_ms / 1000).toFixed(1)}s ${usage}</div>`;
  } catch (e) {
    panel.innerHTML = `<div style="color:#fca5a5">❌ <strong>网络错误</strong><br>${escapeHtml(String(e))}</div>`;
  } finally {
    document.querySelectorAll('.ai-btn-sm').forEach(b => b.disabled = false);
  }
}

function toggleWatch(path, idx, e) {
  if (e) e.stopPropagation();
  const c = getNode(path).companies[idx];
  if (!c) return;
  const tokens = (c.flag || '').split(/\s+/).filter(Boolean);
  const watchIdx = tokens.indexOf('watch');
  if (watchIdx >= 0) {
    tokens.splice(watchIdx, 1);
  } else {
    tokens.push('watch');
  }
  c.flag = tokens.join(' ').trim();
  save();
  render();
}

  getNode(path).companies.splice(idx, 1);

      <button class="secondary" onclick="closeModal()">取消</button>
      <button onclick="doAddChild('${path}')">添加</button>
    </div>`);
}
function doAddChild(path) {
  const n = getNode(path);
  n.children = n.children || [];
  n.children.push({
    id: 'n' + Date.now(),
    name: document.getElementById('m_name').value.trim() || '新子赛道',
    desc: document.getElementById('m_desc').value.trim(),
    layer: parseInt(document.getElementById('m_layer').value),
    expanded: true,
    companies: [],
    children: [],
  });
  n.expanded = true;
  save(); closeModal(); render();
}

function openEditNode(path) {
  const n = getNode(path);
  openModal(`
    <h3>编辑「${escapeHtml(n.name)}」</h3>
    <label>名称</label><input id="m_name" value="${escapeHtml(n.name)}" />
    <label>说明</label><input id="m_desc" value="${escapeHtml(n.desc||'')}" />
    <div class="modal-actions">
      <button class="secondary" onclick="closeModal()">取消</button>
      <button onclick="doEditNode('${path}')">保存</button>
    </div>`);
}
function doEditNode(path) {
  const n = getNode(path);
  n.name = document.getElementById('m_name').value.trim();
  n.desc = document.getElementById('m_desc').value.trim();
  save(); closeModal(); render();
}
function deleteNode(path) {
  if (!confirm('删除该层及其所有子节点？此操作不可撤销。')) return;
  const parts = path.split('.');
  const idx = parseInt(parts.pop());
  parts.pop(); // remove "children"
  const parent = parts.length ? parts.reduce((o,k)=>o[k], data) : data;
  parent.children.splice(idx, 1);
  save(); render();
}

// ============ 搜索 ============
function onSearchInput() {
  const input = document.getElementById('search');
  document.getElementById('searchWrap').classList.toggle('has-value', input.value.length > 0);
  applySearch();
}
function clearSearch() {
  const input = document.getElementById('search');
  input.value = '';
  document.getElementById('searchWrap').classList.remove('has-value');
  applySearch();
  input.focus();
}

let CURRENT_FLAG_FILTER = null;  // 'core' | 'watch' | 'comp' | 'cn' | null

// 单个公司是否匹配 flag 过滤
function flagMatches(flagStr, filter) {
  if (!filter) return true;
  const tokens = (flagStr || '').split(/\s+/).filter(Boolean);
  if (filter === 'comp') {
    // "相关" 定义：没有 core/watch/cn 之一
    return !tokens.includes('core') && !tokens.includes('watch') && !tokens.includes('cn');
  }
  return tokens.includes(filter);
}

function toggleFlagFilter(flag) {
  CURRENT_FLAG_FILTER = (CURRENT_FLAG_FILTER === flag) ? null : flag;
  // 更新激活态视觉
  ['core', 'watch', 'comp', 'cn'].forEach(f => {
    const el = document.getElementById('filter-' + f);
    if (el) el.classList.toggle('filter-on', CURRENT_FLAG_FILTER === f);
  });
  // 激活筛选时展开所有节点，方便查看匹配项；取消时保持当前状态
  if (CURRENT_FLAG_FILTER) {
    walk(data, n => n.expanded = true);
    save(); render();
  } else {
    applySearch();
  }
}

function applySearch() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const filter = CURRENT_FLAG_FILTER;
  const banner = document.getElementById('noResultsBanner');

  // 无搜索且无筛选：全部恢复
  if (!q && !filter) {
    document.querySelectorAll('.node, .company').forEach(el => el.classList.remove('hidden'));
    if (banner) banner.style.display = 'none';
    return;
  }

  // 1. 处理叶子（公司）：同时匹配文本搜索 + flag 筛选
  document.querySelectorAll('.company').forEach(el => {
    const matchText = !q || el.textContent.toLowerCase().includes(q);
    const matchFlag = flagMatches(el.getAttribute('data-flag') || '', filter);
    el.classList.toggle('hidden', !(matchText && matchFlag));
  });

  // 2. 处理节点：从最深开始
  const nodes = Array.from(document.querySelectorAll('.node')).reverse();
  nodes.forEach(el => {
    const headerTxt = el.querySelector(':scope > .node-header')?.textContent.toLowerCase() || '';
    const hasVisibleCompany = Array.from(el.querySelectorAll(':scope > .node-body > .companies > .company')).some(c => !c.classList.contains('hidden'));
    const hasVisibleChild = Array.from(el.querySelectorAll(':scope > .node-body > .node')).some(c => !c.classList.contains('hidden'));
    // node header 文字命中（搜索）仍算命中，但要求该节点下有可见后代才显示
    const selfMatchesText = !q || headerTxt.includes(q);
    const shouldShow = (selfMatchesText && (hasVisibleCompany || hasVisibleChild)) || hasVisibleCompany || hasVisibleChild;
    el.classList.toggle('hidden', !shouldShow);
  });

  // 3. 无结果横幅
  const visibleCount = document.querySelectorAll('.company:not(.hidden)').length;
  if (banner) {
    if (visibleCount === 0) {
      banner.style.display = 'block';
      const queryEl = document.getElementById('noResultsQuery');
      if (queryEl) queryEl.textContent = q || (filter ? `(只看 ${filter})` : '');
    } else {
      banner.style.display = 'none';
    }
  }
}

// ============ 导入导出 ============
function exportData() {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `ai_supply_chain_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}
function importData(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    try { data = JSON.parse(ev.target.result); save(); render(); alert('导入成功'); }
    catch(err) { alert('JSON 解析失败: ' + err.message); }
  };
  r.readAsText(f);
}
function resetData() {
  if (!confirm('恢复默认数据？你的自定义修改会丢失（建议先导出备份）')) return;
  data = structuredClone(DEFAULT_DATA);
  save(); render();
}

// ============ 统计 ============
function updateStat() {
  let layers = 0, total = 0, watch = 0, core = 0;
  walk(data, n => {
    if (n.id && n.id !== 'root') layers++;
    (n.companies || []).forEach(c => {
      total++;
      const f = c.flag || '';
      if (f.includes('watch')) watch++;
      if (f.includes('core')) core++;
    });
  });
  document.getElementById('stat').textContent = `· ${layers} 层赛道 / ${total} 家公司 / 核心 ${core} / 自选 ${watch}`;
}

render();
loadScores();   // 异步加载评分，到了之后会自动 re-render
// Serenity 池仅供 dev 端比对使用（gm_rater/audit_serenity_gap.py），UI 不展示

// 动态计算 header 实际高度，让 chip bar 永远紧贴下面
function syncHeaderHeight() {
  const h = document.querySelector('header')?.offsetHeight || 60;
  document.documentElement.style.setProperty('--header-height', h + 'px');
}
syncHeaderHeight();
window.addEventListener('resize', syncHeaderHeight);
// header 内容变化（如评分加载完更新 stat-bar 后）也重算
new ResizeObserver(syncHeaderHeight).observe(document.querySelector('header'));
</script>
