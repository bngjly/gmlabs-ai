.company.watch { border-color: #f59e0b; background: #3a2f1a; }
.company .ticker { font-weight: 700; color: #4fc3f7; font-size: 13px; }

.btn-del { color: #ef4444; border-color: #ef4444; }

.expanded > .node-header .toggle::before { content: '▼'; }

.stat-bar { font-size: 11px; color: #9aa5b1; padding: 6px 0; }

// ============ 状态 ============
let data = loadData();
let editTarget = null;
let SCORES = {};   // ← 由 fetch scores.json 加载，公司评分数据

function loadData() {
  try {
    const stored = localStorage.getItem('aiChain_v1');
    if (stored) return JSON.parse(stored);
  } catch(e) {}
  return structuredClone(DEFAULT_DATA);
}
function save() { localStorage.setItem('aiChain_v1', JSON.stringify(data)); updateStat(); }

// ============ 评分数据加载 (gm_rater 输出) ============
function loadScores() {
  fetch('scores.json', { cache: 'no-cache' })
    .then(r => r.ok ? r.json() : {})
    .then(s => {
      SCORES = s || {};
      const okCount = Object.values(SCORES).filter(v => v && v.status === 'ok').length;
      console.log(`[scores] loaded ${okCount} graded companies`);
      render();   // 重新渲染让徽章出现
    })
    .catch(err => {
      console.warn('[scores] failed to load, badges will be hidden:', err);
      SCORES = {};
    });
}

// ============ 渲染 ============
function render() {
  document.getElementById('tree').innerHTML = renderNode(data, '');
  applySearch();
  updateStat();
}

function renderNode(node, path) {
  if (node.id === 'root') {
    return (node.children || []).map((c, i) => renderNode(c, `children.${i}`)).join('');
  }
  const expanded = node.expanded !== false;
  const cls = `node ${expanded ? 'expanded' : 'collapsed'} layer-${node.layer || 99}`;
  const childHTML = (node.children || []).map((c, i) => renderNode(c, `${path}.children.${i}`)).join('');
  const companyHTML = renderCompanies(node.companies || [], path);
  return `
    <div class="${cls}" data-path="${path}">
      <div class="node-header" onclick="toggleNode('${path}', event)">
        <span class="toggle"></span>
        <span class="node-title">${escapeHtml(node.name)}</span>
        ${node.desc ? `<span class="node-desc">${escapeHtml(node.desc)}</span>` : ''}
      </div>
      <div class="node-body">
        ${(node.companies && node.companies.length) ? `<div class="sub-section-title">公司</div><div class="companies">${companyHTML}</div>` : ''}
        ${childHTML ? `<div class="sub-section-title" style="margin-top:14px">细分子赛道</div>${childHTML}` : ''}
        <div class="actions">
          <button class="btn-sm" onclick="openAddCompany('${path}')">+ 添加公司</button>
          <button class="btn-sm" onclick="openAddChild('${path}')">+ 添加子赛道</button>
          <button class="btn-sm" onclick="openEditNode('${path}')">✎ 编辑此层</button>
          <button class="btn-sm btn-del" onclick="deleteNode('${path}')">✕ 删除此层</button>
        </div>
      </div>
    </div>`;
}

function renderCompanies(arr, path) {
  return arr.map((c, i) => {
    const flags = (c.flag || '').split(/\s+/);
    const isCore = flags.includes('core');
    const isWatch = flags.includes('watch');
    const isCn = flags.includes('cn');
    let cls = 'company';
    if (isCore) cls += ' core';
    if (isWatch) cls += ' watch';
    const tags = [];
    if (isCore) tags.push('<span class="tag t-core">核心</span>');
    if (isWatch) tags.push('<span class="tag t-watch">自选</span>');
    if (isCn) tags.push('<span class="tag t-cn">中国</span>');
    if (!isCore && !isWatch && !isCn) tags.push('<span class="tag t-comp">相关</span>');

    // 评分徽章 + 特点标签（来自 gm_rater）
    const sc = SCORES[c.t];
    let gradeBadge = '';
    let featTags = '';
    if (sc && sc.status === 'ok') {
      gradeBadge = `<span class="grade-badge grade-${sc.grade}" title="${sc.tier}/${sc.sector} · 总分 ${sc.score}">${sc.grade} · ${sc.score}</span>`;
      if (sc.features && sc.features.length) {
        featTags = `<div class="score-tags">` +
          sc.features.slice(0,2).map(f => `<span class="tag-feat">${f.emoji}${f.name}</span>`).join('') +
          (sc.risks||[]).slice(0,1).map(r => `<span class="tag-risk">${r.emoji}${r.name}</span>`).join('') +
          `</div>`;
      }
    }

    return `<div class="${cls}" onclick="openDetail('${path}', ${i})">
      <span class="del" onclick="deleteCompany('${path}', ${i}, event)">✕</span>
      <div><span class="ticker">${escapeHtml(c.t)}</span><span class="cn-name">${escapeHtml(c.cn || '')}</span>${gradeBadge}</div>
      <span class="role">${escapeHtml(c.role || '')} ${tags.join('')}</span>
      ${featTags}
    </div>`;
  }).join('');
}

function escapeHtml(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ============ 路径取节点 ============
function getNode(path) {
  if (!path) return data;
  return path.split('.').reduce((o, k) => o[k], data);
}
function setNode(path, value) {
  const parts = path.split('.');
  const last = parts.pop();
  const parent = parts.reduce((o, k) => o[k], data);
  parent[last] = value;
}

// ============ 交互 ============
function toggleNode(path, e) {
  e.stopPropagation();
  const n = getNode(path);
  n.expanded = n.expanded === false ? true : false;
  save(); render();
}
function expandAll() { walk(data, n => n.expanded = true); save(); render(); }
function collapseAll() { walk(data, n => { if (n.id !== 'root') n.expanded = false; }); save(); render(); }
function walk(n, fn) { fn(n); (n.children || []).forEach(c => walk(c, fn)); }

// ============ 详情抽屉（公司点击触发，显示 gm_rater 评分）============
function openDetail(path, idx) {
  const c = getNode(path).companies[idx];
  const sc = SCORES[c.t];

  const sectorMap = {
    semiconductor:'半导体', semi_equipment:'半导体设备',
    memory_cyclical:'存储周期', networking:'网络互联',
    optical:'光通信', capital_goods:'电力/工业',
    utility_power:'公用/核电', materials:'材料',
    consumer:'消费', cloud:'云互联网',
    fintech_payment:'金融科技', biotech:'生科',
    reit_dc:'数据中心 REIT', energy_oil:'能源',
    aerospace:'国防航空', auto_ev:'汽车 EV',
    industrial:'工业', financial_bank:'银行金融',
    saas_software:'软件 SaaS', other:'其他'
  };
  const tierMap = { mega:'超大盘 ≥$200B', large:'大盘 $50-200B', mid:'中盘 $5-50B', small:'小盘 <$5B', micro:'微盘 <$500M', unknown:'未知' };

  let scoreHTML;
  if (sc && sc.status === 'ok') {
    const dims = sc.dims, max = sc.dim_max;
    const dimLabels = { G1:'增长动能', G2:'盈利质量', G3:'财务健康', G4:'护城河', G5:'股东回报', G6:'估值合理' };
    const bars = ['G1','G2','G3','G4','G5','G6'].map(k => {
      const v = dims[k] || 0;
      const m = max[k] || 1;
      const pct = Math.round(v / m * 100);
      return `<div class="dim-bar">
        <span class="lbl">${k} ${dimLabels[k]}</span>
        <span class="track"><span class="fill" style="width:${pct}%"></span></span>
        <span class="pct">${v.toFixed(1)} / ${m}</span>
      </div>`;
    }).join('');

    const featRows = (sc.features||[]).map(f =>
      `<div class="drawer-tag-row feat"><span class="emj">${f.emoji}</span>${f.name}</div>`).join('')
      || '<div class="no-score" style="padding:8px">未触发特点标签</div>';
    const riskRows = (sc.risks||[]).map(r =>
      `<div class="drawer-tag-row risk"><span class="emj">${r.emoji}</span>${r.name}</div>`).join('')
      || '<div class="no-score" style="padding:8px">未触发风险标签</div>';

    scoreHTML = `
      <div class="drawer-score">
        <span class="grade-big grade-${sc.grade}">${sc.grade}</span>
        <span class="total-num">${sc.score}</span><span class="total-of">/ 100</span>
      </div>
      <div class="drawer-tier-sector">
        <span class="pill">${tierMap[sc.tier] || sc.tier}</span>
        <span class="pill">${sectorMap[sc.sector] || sc.sector}</span>
        ${sc.market_cap_usd_b ? `<span class="pill">市值 $${sc.market_cap_usd_b}B</span>` : ''}
      </div>
      <div class="drawer-section">
        <h4>六维评分</h4>
        <div class="dim-bars">${bars}</div>
      </div>
      <div class="drawer-section">
        <h4>特点</h4>
        <div class="drawer-tags">${featRows}</div>
      </div>
      <div class="drawer-section">
        <h4>风险</h4>
        <div class="drawer-tags">${riskRows}</div>
      </div>
      <div class="score-meta">数据更新 ${sc.evaluated_at} · 引擎 gm_rater v1.0</div>`;
  } else {
    scoreHTML = `
      <div class="no-score">
        ⏳ 此标的暂无评分数据<br>
        <span style="font-size:11px">可能是：A 股 / 未上市 / yfinance 暂时无法获取</span>
      </div>`;
  }

  document.getElementById('drawerInner').innerHTML = `
    <div class="drawer-head">
      <div>
        <div class="ticker-big">${escapeHtml(c.t)}</div>
        <div class="name-cn">${escapeHtml(c.cn || '')}</div>
        <div style="font-size:12px;color:#9aa5b1;margin-top:4px">${escapeHtml(c.role || '')}</div>
      </div>
      <span class="close-x" onclick="closeDrawer()">×</span>
    </div>
    ${scoreHTML}
    <div class="drawer-actions">
      <button class="btn-sm" onclick="closeDrawer(); openEditCompany('${path}', ${idx})">✎ 编辑</button>
      <button class="btn-sm btn-del" onclick="closeDrawer(); deleteCompany('${path}', ${idx}, event)">✕ 删除</button>
    </div>`;
  document.getElementById('drawer').classList.add('show');
}

    </select>
    <div class="modal-actions">
      <button class="secondary" onclick="closeModal()">取消</button>
      <button onclick="doAddChild('${path}')">添加</button>
    </div>`);
}
function doAddChild(path) {
  const n = getNode(path);
  n.children = n.children || [];
  n.children.push({
    id: 'n' + Date.now(),
    name: document.getElementById('m_name').value.trim() || '新子赛道',
    desc: document.getElementById('m_desc').value.trim(),
    layer: parseInt(document.getElementById('m_layer').value),
    expanded: true,
    companies: [],
    children: [],
  });
  n.expanded = true;
  save(); closeModal(); render();
}

function openEditNode(path) {
  const n = getNode(path);
  openModal(`
    <h3>编辑「${escapeHtml(n.name)}」</h3>
    <label>名称</label><input id="m_name" value="${escapeHtml(n.name)}" />
    <label>说明</label><input id="m_desc" value="${escapeHtml(n.desc||'')}" />
    <div class="modal-actions">
      <button class="secondary" onclick="closeModal()">取消</button>
      <button onclick="doEditNode('${path}')">保存</button>
    </div>`);
}
function doEditNode(path) {
  const n = getNode(path);
  n.name = document.getElementById('m_name').value.trim();
  n.desc = document.getElementById('m_desc').value.trim();
  save(); closeModal(); render();
}
function deleteNode(path) {
  if (!confirm('删除该层及其所有子节点？此操作不可撤销。')) return;
  const parts = path.split('.');
  const idx = parseInt(parts.pop());
  parts.pop(); // remove "children"
  const parent = parts.length ? parts.reduce((o,k)=>o[k], data) : data;
  parent.children.splice(idx, 1);
  save(); render();
}

// ============ 搜索 ============
function applySearch() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  if (!q) {
    document.querySelectorAll('.node, .company').forEach(el => el.classList.remove('hidden'));
    return;
  }
  document.querySelectorAll('.company').forEach(el => {
    el.classList.toggle('hidden', !el.textContent.toLowerCase().includes(q));
  });
  document.querySelectorAll('.node').forEach(el => {
    const txt = el.querySelector('.node-header').textContent.toLowerCase();
    const hasVisibleCompany = Array.from(el.querySelectorAll(':scope > .node-body > .companies > .company')).some(c => !c.classList.contains('hidden'));
    const hasVisibleChild = Array.from(el.querySelectorAll(':scope > .node-body > .node')).some(c => !c.classList.contains('hidden'));
    el.classList.toggle('hidden', !(txt.includes(q) || hasVisibleCompany || hasVisibleChild));
  });
}

// ============ 导入导出 ============
function exportData() {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `ai_supply_chain_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}
function importData(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    try { data = JSON.parse(ev.target.result); save(); render(); alert('导入成功'); }
    catch(err) { alert('JSON 解析失败: ' + err.message); }
  };
  r.readAsText(f);
}
function resetData() {
  if (!confirm('恢复默认数据？你的自定义修改会丢失（建议先导出备份）')) return;
  data = structuredClone(DEFAULT_DATA);
  save(); render();
}

// ============ 统计 ============
function updateStat() {
  let layers = 0, total = 0, watch = 0, core = 0;
  walk(data, n => {
    if (n.id && n.id !== 'root') layers++;
    (n.companies || []).forEach(c => {
      total++;
      const f = c.flag || '';
      if (f.includes('watch')) watch++;
      if (f.includes('core')) core++;
    });
  });
  document.getElementById('stat').textContent = `· ${layers} 层赛道 / ${total} 家公司 / 核心 ${core} / 自选 ${watch}`;
}

render();
loadScores();   // 异步加载评分，到了之后会自动 re-render
</script>
</body>
</html>
