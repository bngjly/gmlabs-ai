<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-mono);display:flex;gap:10px;padding:14px;background:#fff}
.sw{flex:1;border-radius:10px;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;height:110px;font-size:11px;line-height:1.5;border:1px solid var(--yoyo-line)}</style></head>
<body>
<div class="sw" style="background:var(--yoyo-bg);color:var(--yoyo-ink)">画布<br>#EEF1F7</div>
<div class="sw" style="background:var(--yoyo-card);color:var(--yoyo-ink)">卡片<br>#FFFFFF</div>
<div class="sw" style="background:var(--yoyo-line);color:var(--yoyo-ink)">分隔线<br>#DCE3ED</div>
<div class="sw" style="background:var(--yoyo-mute);color:#fff">次要文字<br>#46586E</div>
<div class="sw" style="background:var(--yoyo-faint);color:#fff">弱文字<br>#93A1B4</div>
<div class="sw" style="background:var(--yoyo-ink);color:#fff">正文/标题<br>#050F1E</div>
</body></html>
