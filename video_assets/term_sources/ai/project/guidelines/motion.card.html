<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:#fff;font-family:var(--font-cjk);display:grid;grid-template-columns:1fr 1fr;gap:10px}
.r{background:var(--yoyo-bg);border:1px solid var(--yoyo-line);border-radius:10px;padding:12px 14px}
.k{font-family:var(--font-mono);font-size:10px;letter-spacing:0.16em;color:var(--yoyo-blue)}
.v{font-size:14px;color:var(--yoyo-ink);margin-top:5px;font-weight:600}</style></head>
<body>
<div class="r"><div class="k">REVEAL</div><div class="v">easeOutCubic · 0.55s · 上移 14–26px</div></div>
<div class="r"><div class="k">POP</div><div class="v">easeOutBack · 0.5s · scale 0.6→1</div></div>
<div class="r"><div class="k">SCENE CROSSFADE</div><div class="v">0.4s 淡入 / 0.45s 淡出</div></div>
<div class="r"><div class="k">STAGGER</div><div class="v">列表项间隔 0.06–1.4s · 定帧收尾 ≥5s</div></div>
</body></html>
